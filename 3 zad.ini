1 Padding pri RSA- При учебникарски RSA криптирането е детерминистично,за едно и също съобщение винаги получаваш
един и същ шифротекст,защото няма случайност.
OAEP padding -Добавя случаен компонент към съобщението преди криптиране и така всеки път входът към RSA е различен,
съответно о шифротекстът е различен.


